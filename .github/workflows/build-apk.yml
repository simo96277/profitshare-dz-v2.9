name: Build ProfitShare DZ V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ProfitShare project
        run: |
          set -e

          TAR_FILE=$(find . -maxdepth 2 -type f -name "*.tar" | head -n 1)

          if [ -z "$TAR_FILE" ]; then
            echo "ERROR: TAR project file not found."
            exit 1
          fi

          echo "Found TAR: $TAR_FILE"

          mkdir -p extracted
          tar -xf "$TAR_FILE" -C extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Flutter project
        run: |
          set -e

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          set -e

          rm -rf build_mobile

          flutter create \
            --project-name profitshare_dz \
            build_mobile

          cp "$PROJECT_DIR/pubspec.yaml" build_mobile/pubspec.yaml
          cp "$PROJECT_DIR/lib/main.dart" build_mobile/lib/main.dart

      - name: Get dependencies
        working-directory: build_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: build_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfitShare-DZ-V2-APK
          path: build_mobile/build/app/outputs/flutter-apk/app-release.apk
